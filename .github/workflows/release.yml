name: Release

# Push a version tag (npm version patch && git push --follow-tags) to publish.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  # npm trusted publishing (OIDC): no long-lived NPM_TOKEN.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      # The full suite is run locally before tagging. Several process/hook tests
      # depend on the host environment and fail on GitHub's Linux runners.
      - name: Tag matches package.json version
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      # prepack runs `vite build`, so web-dist/ is fresh in the tarball.
      # Trusted publishing (OIDC, npm >= 11.5.1): npm exchanges the GitHub ID token itself.
      - run: npm --version && npm publish --loglevel verbose
