name: Release

# Push a version tag (npm version patch && git push --follow-tags) to publish.
#
# Publish runs only after EVERY gate job passes AND a required reviewer approves
# the protected `release` environment. Repository admin setup (not expressible
# in this file, must exist before relying on tag-triggered publish):
#   1. Settings → Environments → `release`: required reviewers (≥1, not the
#      tag author), "Prevent self-review", deployment branches/tags limited to
#      `v*` tags.
#   2. Settings → Rules → tag ruleset for `v*`: restrict creation/update/
#      deletion to maintainers (tag protection).
#   3. npm trusted publisher bound to this repo + `release.yml` + environment
#      `release`.
# Manual evidence (Windows launcher/PM2 smoke; macOS terminal evidence only if
# macOS support is claimed) is attached to the approval per
# docs/release-checklist.md. Typecheck alone is not a security gate.
#
# All actions are pinned to full commit SHAs (version in the trailing comment).
on:
  push:
    tags: ['v*']

# Least privilege by default; only the publish job gets the OIDC token.
permissions:
  contents: read

jobs:
  typecheck-build:
    name: Gate · typecheck + build:web
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.20.0
      - run: bun install --frozen-lockfile
      - run: node scripts/node-preflight.mjs
      - run: bun run typecheck
      - run: bun run build:web
      - name: Tag matches package.json version
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"

  deterministic-suites:
    name: Gate · affected deterministic suites
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.20.0
      - run: bun install --frozen-lockfile
      - run: node scripts/node-preflight.mjs
      # A stable subset of the runtime/provider hardening specs. The full suite
      # still has host-environment failures on GitHub's Linux runners, so it is
      # run locally before tagging (see docs/release-checklist.md).
      - name: Vitest (Node 22.20)
        run: >-
          node node_modules/vitest/vitest.mjs run
          tests/harness/outbound-http.spec.ts
          tests/harness/mcp-outbound-policy.spec.ts
          tests/scripts/repo-freeze.spec.ts
          tests/web/terminals-lifecycle.spec.ts
          tests/harness/effective-model.spec.ts
          tests/harness/provider-error-classification.spec.ts
          tests/harness/reasoning-round-trip.spec.ts
          tests/harness/llm-openai.spec.ts
          tests/scripts/bench-metrics.spec.ts
          tests/harness/base-prompt-guidance.spec.ts
        timeout-minutes: 15

  linux-runtime-probes:
    name: Gate · Bun runtime + PTY probes (Linux, macOS)
    # Bun 1.4.3: real Undici dispatcher, DNS policy, and
    # `bun scripts/pty-probes.mjs --require` (real bash PTY teardown on Linux,
    # zsh and bash on macOS).
    uses: ./.github/workflows/runtime-probes.yml
    permissions:
      contents: read

  # Build the tarball WITHOUT the OIDC token: `bun install` and `npm pack`
  # (prepack runs `vite build`) execute dependency code.
  # None of that code ever sees `id-token: write`.
  pack:
    name: Pack tarball (no OIDC)
    needs: [typecheck-build, deterministic-suites, linux-runtime-probes]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.20.0
      - name: Tag matches package.json version
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - run: bun install --frozen-lockfile
      # prepack runs `vite build`, so web-dist/ is fresh in the tarball.
      - name: npm pack
        run: |
          mkdir -p pack-out
          npm pack --pack-destination pack-out
          ls -l pack-out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-tarball
          path: pack-out/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish (npm, OIDC)
    needs: [pack]
    runs-on: ubuntu-24.04
    # Protected environment: required reviewers must approve before this job
    # starts (and before any OIDC token can be minted).
    environment: release
    permissions:
      contents: read
      # npm trusted publishing (OIDC): no long-lived NPM_TOKEN.
      id-token: write
    # No checkout, no install, no repo code: only the prebuilt tarball is
    # published, with lifecycle scripts disabled.
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-tarball
          path: pack-out
      # npm stays only for trusted publishing (OIDC), which bun publish lacks.
      # Trusted publishing needs npm >= 11.5.1: Node 24.22.0 ships npm 11.19.1
      # (verified via https://nodejs.org/dist/index.json). Bump deliberately.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.0
          registry-url: https://registry.npmjs.org
      - name: npm publish (prebuilt tarball, scripts disabled)
        run: |
          npm --version
          shopt -s nullglob
          tarballs=(pack-out/*.tgz)
          test "${#tarballs[@]}" -eq 1
          test "$(basename "${tarballs[0]}")" = "dnt-harness-${GITHUB_REF_NAME#v}.tgz"
          npm publish "./${tarballs[0]}" --ignore-scripts --loglevel verbose
