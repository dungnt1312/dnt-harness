name: Runtime probes

# Linux gate for Bun runtime / DNS / PTY behaviour. Kept separate from the full
# suite, which has known host-environment failures on GitHub's Linux runners.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  linux-probes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
      - run: bun install --frozen-lockfile
      - run: node scripts/node-preflight.mjs
      - run: bun scripts/runtime-probes.mjs
