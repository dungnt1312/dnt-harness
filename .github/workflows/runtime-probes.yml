name: Runtime probes

# Linux gate for Bun runtime / DNS / PTY behaviour. Kept separate from the full
# suite, which has known host-environment failures on GitHub's Linux runners.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  linux-probes:
    runs-on: ubuntu-latest
    steps:
      # Pinned to commit SHAs: this workflow is also called by release.yml.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.20.0
      - run: bun install --frozen-lockfile
      - run: node scripts/node-preflight.mjs
      - run: bun scripts/runtime-probes.mjs
      # RH-3: real bash under Bun's PTY; remove/reap/natural-exit/disposeAll teardown.
      - run: bun scripts/pty-probes.mjs --require
        timeout-minutes: 5
