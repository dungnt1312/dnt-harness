name: Linux full suite

# The whole Vitest suite on GitHub's Linux runner (Node 22.20, Bun 1.4.3).
# Separate from runtime-probes.yml so the fast probe gate never waits on it.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-suite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-suite:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.20.0
      - run: bun install --frozen-lockfile
      - run: bun run test
        timeout-minutes: 30

  # Suites kept out of release.yml's deterministic gate until they prove stable
  # here (docs/release-checklist.md). Three independent runs per workflow run,
  # each in isolation, as the release gate runs them.
  candidate-suites:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        attempt: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.20.0
      - run: bun install --frozen-lockfile
      - run: node scripts/node-preflight.mjs
      - name: Candidate suites, one Vitest run per file
        run: |
          status=0
          for spec in \
            tests/web/terminals-posix.spec.ts \
            tests/web/terminals.spec.ts \
            tests/web/server-terminals.spec.ts \
            tests/web/server-models.spec.ts \
            tests/bins/headless.spec.ts \
            tests/harness/image-tools.spec.ts \
            tests/harness/image-tools-mode-exposure.spec.ts \
            tests/harness/video-tools.spec.ts \
            tests/harness/mcp-oauth.spec.ts \
            tests/harness/mcp-oauth-config.spec.ts \
            tests/harness/mcp-oauth-discovery.spec.ts \
            tests/harness/mcp-oauth-registration.spec.ts \
            tests/web/mcp-oauth-connect.spec.ts \
            tests/web/mcp-oauth-paste.spec.ts \
            tests/web/mcp-oauth-races.spec.ts \
            tests/web/mcp-oauth-redirect.spec.ts \
            tests/web/mcp-shutdown-oauth.spec.ts \
            tests/harness/mcp-client-fixes.spec.ts
          do
            if npx vitest run "$spec"; then echo "CANDIDATE PASS $spec"; else echo "CANDIDATE FAIL $spec"; status=1; fi
          done
          exit "$status"
        timeout-minutes: 20
