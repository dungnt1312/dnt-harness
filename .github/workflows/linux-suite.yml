name: Linux full suite

# The whole Vitest suite on GitHub's Linux runner (Node 22.20, Bun 1.4.3).
# Separate from runtime-probes.yml so the fast probe gate never waits on it.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-suite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-suite:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.20.0
      - run: bun install --frozen-lockfile
      - run: bun run test
        timeout-minutes: 30
